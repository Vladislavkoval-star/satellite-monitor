# Tests and lint on every change.
#
# The monitor's own workflows run on a schedule and hold Telegram and Google
# credentials, so nothing here may touch secrets: this is the one workflow a
# stranger's pull request can start. A fork PR gets a read-only token and no
# secrets by design, and `permissions` below drops even the defaults — the job
# reads the code, runs the suite, and can do nothing else.
#
# It exists so a pull request has something to fail. The alerting logic is worth
# reviewing on a diff, and until now the suite ran only on a developer's laptop.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # No browsers needed: the suite drives the decision logic, not Playwright.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # Node 20 is what the monitor workflow pins, so the suite has to pass on
      # it. `node --test` only learned glob patterns in 22, and a bare directory
      # argument means different things in the two — hence the shell-expanded
      # paths in package.json. This job is what would have caught that.
      - name: Test
        run: npm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # Proves the lock still resolves and every hash still matches before the
      # Monday job — which holds the GA4 credential — tries the same install.
      - name: Verify the hash-pinned lock installs
        run: pip install --require-hashes --quiet -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q scripts/refresh_targets.py
