name: monitor

on:
  schedule:
    # Every 10 minutes, both tiers. The repository is public, so Actions minutes
    # are free and unmetered; the only real budget is the ~60s the job takes,
    # well inside the interval, and `concurrency` queues any overlap.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# One job runs both tiers: at this fleet size the render tier is cheap, and a
# single job pays the ~15s setup cost once per cycle instead of twice. It also
# means the render tier reads availability state written seconds earlier.
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # System libraries are only fetched on a cache miss; --with-deps runs apt
      # and costs ~15s, which is most of the setup budget on a warm run.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Availability check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check.mjs

      - name: Render check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/render.mjs

      # Dead man's switch. The external watchdog alerts when this ping stops
      # arriving — silence in Telegram otherwise looks identical to good health.
      # Deliberately not `if: always()`: a failed run must not report healthy.
      - name: Ping heartbeat
        if: success() && env.HEARTBEAT_URL != ''
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: curl -fsS --retry 3 --max-time 20 "$HEARTBEAT_URL" > /dev/null

      - name: Persist state
        if: always()
        run: |
          git config user.name  "pl-monitor[bot]"
          git config user.email "pl-monitor@users.noreply.github.com"
          # State files are machine-generated and this run holds the newest
          # observation, so a concurrent push is resolved by replaying our files
          # onto the new tip rather than by rebasing — rebasing two different
          # versions of the same JSON just conflicts and loses the commit.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            if [ -z "$(git status --porcelain state/)" ]; then
              echo "state unchanged"; exit 0
            fi
            git add state/
            git commit -q -m "chore(state): monitor run [skip ci]"
            if git push -q origin HEAD:main; then
              echo "state pushed on attempt $i"; exit 0
            fi
            echo "push lost the race, retrying ($i)"
            sleep $((i * 3))
          done
          echo "::error::state push failed after 5 attempts — следующий прогон может продублировать алерт"
          exit 1
