name: refresh-targets

on:
  schedule:
    # Mondays 04:00 UTC — rebuild the monitored list from GA4 traffic.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  # Required to mint the OIDC token that workload identity federation exchanges
  # for a short-lived Google credential. Harmless while the JSON key is still in
  # use — no token is requested unless the auth step below runs.
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # Hash-pinned. This step's successor holds the GA4 credential, so a
      # dependency resolved at install time — direct or transitive — would run
      # with read access to the analytics property. --require-hashes turns a
      # swapped release into a failed job instead of a silent compromise.
      - name: Install dependencies
        run: pip install --require-hashes --quiet -r requirements.txt

      # Keyless auth, once the federation exists on the Google side. Until then
      # the step is skipped and the static key below is used instead.
      - name: Authenticate to Google (workload identity federation)
        if: vars.GA4_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GA4_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GA4_SERVICE_ACCOUNT_EMAIL }}

      - name: Rebuild targets from GA4
        env:
          # Empty once the federation is configured, at which point the script
          # falls through to the credential the auth step left on disk.
          GA4_SERVICE_ACCOUNT_JSON: ${{ vars.GA4_WORKLOAD_IDENTITY_PROVIDER == '' && secrets.GA4_SERVICE_ACCOUNT_JSON || '' }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          EXCLUDED_HOSTS: ${{ vars.EXCLUDED_HOSTS }}
          TOP_N_PER_TYPE: ${{ vars.TOP_N_PER_TYPE || '5' }}
        run: python scripts/refresh_targets.py

      - name: Commit updated targets
        run: |
          git config user.name  "pl-monitor[bot]"
          git config user.email "pl-monitor@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            if [ -z "$(git status --porcelain targets.json)" ]; then
              echo "targets unchanged"; exit 0
            fi
            git add targets.json
            git commit -q -m "chore(targets): refresh from GA4 [skip ci]"
            if git push -q origin HEAD:main; then
              echo "targets pushed on attempt $i"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "::error::targets push failed after 5 attempts"
          exit 1
