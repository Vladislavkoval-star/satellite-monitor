name: refresh-targets

on:
  schedule:
    # Mondays 04:00 UTC — rebuild the monitored list from GA4 traffic.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet google-analytics-data

      - name: Rebuild targets from GA4
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          EXCLUDED_HOSTS: ${{ vars.EXCLUDED_HOSTS }}
          TOP_N_PER_TYPE: ${{ vars.TOP_N_PER_TYPE || '5' }}
        run: python scripts/refresh_targets.py

      - name: Commit updated targets
        run: |
          if [ -z "$(git status --porcelain targets.json)" ]; then
            echo "targets unchanged"; exit 0
          fi
          git config user.name  "pl-monitor[bot]"
          git config user.email "pl-monitor@users.noreply.github.com"
          git add targets.json
          git commit -m "chore(targets): refresh from GA4 [skip ci]"
          # This job overlaps a monitor run that pushes state/, so a plain push
          # loses the weekly refresh to a non-fast-forward rejection.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((i * 3))
          done
          echo "::error::targets push failed after 5 attempts"
          exit 1
